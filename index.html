<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nihaal Nazeer - Interactive Portfolio</title>
    <link rel="icon" type="image/png" href="https://assets.nihaalnazeer.com/buttonoverlays/logo.png" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      canvas {
        display: block;
      }

      /* Loading screen styles */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        color: white;
        font-size: 24px;
        letter-spacing: 2px;
      }

      .loading-text {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .dots {
        display: inline-block;
      }

      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: white;
        animation: dotAnimation 1.4s infinite ease-in-out;
        margin: 0 2px;
      }

      .dot:nth-child(1) { animation-delay: -0.32s; }
      .dot:nth-child(2) { animation-delay: -0.16s; }
      .dot:nth-child(3) { animation-delay: 0s; }

      @keyframes dotAnimation {
        0%, 80%, 100% {
          transform: scale(0);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Crosshair overlay styles */
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 10001;
        display: none; /* Hidden initially until loading is complete */
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-text">
        Your experience is loading
        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>

    <!-- Crosshair Overlay -->
    <div id="crosshair">
      <img
        src="https://assets.nihaalnazeer.com/models/crosshairweb.svg"
        alt="Crosshair"
        style="width: 50px; height: 50px"
      />
    </div>

    <!-- Main interactive content -->
    <script type="module" src="./interactive/main.js"></script>

    <!-- Loading screen script -->
    <script>
      // Global function to hide loading screen when 3D content is ready
      window.hideLoadingScreen = function() {
        const loadingScreen = document.getElementById('loading-screen');
        const crosshair = document.getElementById('crosshair');
        
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          loadingScreen.style.transition = 'opacity 0.5s ease-out';
          
          setTimeout(() => {
            loadingScreen.style.display = 'none';
            if (crosshair) {
              crosshair.style.display = 'block';
            }
          }, 500);
        }
      };

      // Fallback: hide loading screen after a maximum time (in case something goes wrong)
      setTimeout(() => {
        if (document.getElementById('loading-screen').style.display !== 'none') {
          window.hideLoadingScreen();
        }
      }, 15000); // 15 seconds maximum wait time
    </script>
  </body>
</html>
