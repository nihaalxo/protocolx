    <style>
      body {
        margin: 0;

      canvas {
        display: block;

      /* Crosshair overlay styles */
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 10001;
      }
    </style>
  </head>
  <body>
    <!-- Crosshair Overlay -->
    <div id="crosshair">
      <img
        src="https://assets.nihaalnazeer.com/models/crosshairweb.svg"
        alt="Crosshair"
        style="width: 50px; height: 50px"
      />
    </div>

    <!-- Main interactive content -->
    <script type="module" src="./interactive/main.js"></script>
  </body>
